<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download File</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Unduh File</h1>
    <p>Klik tombol di bawah untuk mengunduh file:</p>
    
    <!-- Tombol download langsung -->
    <a href="contoh.txt" download="contoh.txt" class="btn">Download Langsung</a>

    <!-- Tombol download via JavaScript -->
    <button id="downloadBtn" class="btn">Download via JS</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
